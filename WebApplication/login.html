<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <h1>Login</h1>

    <form id="loginForm">

      <input name="password" type="password" placeholder="password" />

    <p id="error"></p>

    <a href="/register.html">Create account</a>

    <script type="module" src="./js/login.js"></script>
  </body>
</html>
